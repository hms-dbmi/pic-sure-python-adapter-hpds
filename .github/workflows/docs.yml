name: Docs

on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads git history/tags for the version

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv sync --frozen --group docs

      - name: Build docs (strict mode catches broken references)
        run: uv run mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
