name: Docs

# Build on every pull request and every branch push (except the generated
# docs branch); deploy only from the default branch and published releases.
on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads git history/tags for the version

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - run: uv sync --frozen --group docs

      - name: Build docs (strict mode catches broken references)
        run: uv run mkdocs build --strict

      # Deploying from any branch that happens to build would let a feature
      # push overwrite the published site. Compare against the repository's
      # own default branch so the guard cannot go stale if that branch is
      # renamed or repointed.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
