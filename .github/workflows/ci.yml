name: CI

# Every pull request regardless of its base, and every branch push except the
# generated docs branch: a `branches: [main]` allow-list silently leaves new
# branches unchecked until someone remembers to add them.
on:
  pull_request:
  push:
    branches-ignore:
      - gh-pages
  workflow_dispatch:

# A push and its open pull request are the same commit, so collapse them into
# one group rather than running the matrix twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads git history/tags for the version
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv sync --frozen
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/
      - run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs reads git history/tags for the version
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run pytest tests/unit/ -v --cov=picsure --cov-fail-under=80
